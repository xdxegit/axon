name: Release

# Builds native installers for Windows, macOS (x64 + arm64) and Linux
# (AppImage / deb / rpm / tar.gz) plus the "Axon Glow" wizard, then publishes
# everything to a single GitHub Release.
#
# Build and publish are split on purpose: each OS only *builds* and uploads its
# files as workflow artifacts. A final single job downloads them all and creates
# the Release once — otherwise the three matrix jobs race each other deleting and
# re-uploading the same release assets (HTTP 404s on concurrent delete/update).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # rpm target needs the rpmbuild toolchain, which isn't on the runner image.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      # electron-builder defaults to the host OS, so each runner emits its own
      # installers. Signing is disabled (mac.identity=null + the env below).
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # The "Axon Glow" wizard wraps the native installers built above (it bundles
      # this OS's payload from release/ via extraResources). Build it per OS too.
      - name: Build Axon Glow installer
        working-directory: installer
        run: npm install && npm run dist:auto
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Only the Axon Glow wizard ships in the Release. The native installers are
      # still built above (Glow embeds this OS's one as a resource) but are not
      # uploaded/published — Glow is the single entry point for users.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axon-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            release-installer-*/*.exe
            release-installer-*/*.dmg
            release-installer-*/*.AppImage

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Beta tags (e.g. v2.0.0-beta) are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            dist/**/Axon-Glow-*.exe
            dist/**/Axon-Glow-*.dmg
            dist/**/Axon-Glow-*.AppImage
