name: Release

# Builds native installers for Windows, macOS (x64 + arm64) and Linux
# (AppImage / deb / rpm / tar.gz) and attaches them to a GitHub Release.
# Trigger by pushing a tag like `v1.2.0`, or run manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # rpm target needs the rpmbuild toolchain, which isn't on the runner image.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      # electron-builder defaults to the host OS, so each runner emits its own
      # installers. Signing is disabled (mac.identity=null + the env below).
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The "Axon Glow" wizard wraps the native installers built above (it bundles
      # this OS's payload from release/ via extraResources). Build it per OS too.
      - name: Build Axon Glow installer
        working-directory: installer
        run: npm install && npm run dist:auto
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axon-${{ matrix.os }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.zip
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*.tar.gz
            release-installer-*/**/*.exe
            release-installer-*/**/*.dmg
            release-installer-*/**/*.zip
            release-installer-*/**/*.AppImage
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Beta tags (e.g. v2.0.0-beta) are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.zip
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*.tar.gz
            release-installer-*/**/*.exe
            release-installer-*/**/*.dmg
            release-installer-*/**/*.zip
            release-installer-*/**/*.AppImage
